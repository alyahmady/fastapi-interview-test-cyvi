{% extends 'base.html' %}
{% block title %}
    Home
{% endblock %}

{% block header_title %}
    Home
{% endblock %}

{% block body %}
    <p>Welcome to the home page!</p>

    <br/>

    {% if is_admin_logged_in %}
        <form action="{{ url_for('admin_logout') }}" method="post">
            <input type="submit" value="Logout"/>
        </form>
    {% else %}
        <a href="{{ url_for('admin_login') }}">
            Login
        </a>
    {% endif %}

    <br/>

    <a href="{{ url_for('customers_list') }}">
        Customers List
    </a>
{% endblock %}
